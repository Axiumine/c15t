# Test stand-in for cloudflare-realip.conf. Trusts the local test client instead of Cloudflare ranges,
# so `curl -H 'CF-Connecting-IP: 203.0.113.7'` exercises real_ip.
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1/128;
real_ip_header CF-Connecting-IP;
