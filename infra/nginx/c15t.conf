# Shared by every website vhost. The vhost sets `set $c15t_site <siteKey>;` first.
# Needs conf.d/c15t-upstreams.conf (upstream c15t_consent_api).
#
# `^~` is required: without it nginx still tries the regex locations of the host vhost after the
# prefix match, and a site's own `location ~* \.(js|json)$` or `location ~ ^/api/` would answer
# /api/c15t/* instead of consent-api (silently, nginx -t passes). With `^~` a regex location is
# never consulted for these paths, whatever the vhost defines.
location ^~ /api/c15t/ {
    rewrite ^/api/c15t/(.*)$ /s/$c15t_site/$1 break;
    # The banner calls these routes with fetch(): never answer it with an HTML error page.
    error_page 502 503 504 = @c15t_consent_api_down;
    proxy_pass http://c15t_consent_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;   # visitor IP, restored by real_ip; replaces any client value
    proxy_set_header Forwarded "";                   # an empty value drops the client's header
    proxy_set_header X-Real-IP "";
    # CF-IPCountry and cf-region-code pass through unchanged
}

location @c15t_consent_api_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The consent service is temporarily unavailable."}}\n';
}
