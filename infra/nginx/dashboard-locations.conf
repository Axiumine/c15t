# Server-level directives and locations of the dashboard vhost, without listen / TLS / server_name.
# Included by infra/nginx/dashboard.conf (production, TLS) and by infra/test (plain HTTP), so both
# run exactly the same rules. Installed by infra/deploy.sh as snippets/c15t-dashboard-locations.conf.
#
# The including server block must set `root` (the dashboard-web dist directory).
# Needs: conf.d/c15t-upstreams.conf (upstream c15t_dashboard_api and map $c15t_assets_cache)
#        snippets/c15t-dashboard-headers.conf
#
# add_header is NOT inherited into a location that has its own add_header, so every location below
# includes the headers snippet, and every add_header uses `always` (errors get the headers too).

server_tokens off;
absolute_redirect off;       # a redirect must not leak the http scheme or the origin port behind Cloudflare
client_max_body_size 1m;

# Errors raised before a location is chosen (400, 414, ...) still get X-Robots-Tag and the rest.
include snippets/c15t-dashboard-headers.conf;

# JSON for errors that nginx itself generates when dashboard-api is down (same shape as the API).
location @c15t_dashboard_api_down {
    include snippets/c15t-dashboard-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The service is temporarily unavailable."}}\n';
}

location = /robots.txt {
    include snippets/c15t-dashboard-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /robots.txt =404;
}

# Never serve or fall back to dotfiles (.git, .env, .vite/manifest.json, ...).
location ~ /\. {
    include snippets/c15t-dashboard-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}

location ^~ /api/ {
    include snippets/c15t-dashboard-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Cache-Control;     # one value only: nginx's, not a second one from the API
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Powered-By;
    error_page 502 503 504 = @c15t_dashboard_api_down;

    proxy_pass http://c15t_dashboard_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;   # visitor IP, restored by real_ip; replaces any client value
    proxy_set_header Forwarded "";                   # an empty value drops the client's header
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;                         # CSV export streams for longer than a normal call
}

# Hashed build output. The map keeps `immutable` for 200 and 304 only; a 404 is no-store.
location ^~ /assets/ {
    include snippets/c15t-dashboard-headers.conf;
    add_header Cache-Control $c15t_assets_cache always;
    try_files $uri =404;
}

# The SPA: any other path falls back to index.html (client-side routing).
location / {
    include snippets/c15t-dashboard-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
