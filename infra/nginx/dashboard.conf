# Dashboard vhost (production, TLS). README D7 and "5. nginx (once)".
#
# Install once per host, then edit the PER-HOST block:
#   sudo cp infra/nginx/dashboard.conf /etc/nginx/sites-available/c15t-dashboard.conf
#   sudo ln -s ../sites-available/c15t-dashboard.conf /etc/nginx/sites-enabled/
#   (run `nginx -t` and reload only after the first infra/deploy.sh: it creates the files listed below,
#    and the test fails until they exist)
# infra/deploy.sh does NOT overwrite this file, because it holds per-host values. It does keep
# everything below `include` up to date: the locations, the headers snippet, the upstreams and the map.
#
# Needs nginx 1.25.1 or newer (`http2 on;`), and these files from infra/deploy.sh:
#   conf.d/c15t-upstreams.conf                 (upstream c15t_dashboard_api, map $c15t_assets_cache)
#   conf.d/cloudflare-realip.conf              (infra/nginx/update-cloudflare-ips.sh)
#   snippets/c15t-dashboard-headers.conf
#   snippets/c15t-dashboard-locations.conf     (the shared locations, also used by infra/test)

server {
    # ---- PER-HOST: listen, names, certificates ------------------------------------------------
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    # Cloudflare Origin CA certificate (SSL mode "Full (strict)"). Created in the Cloudflare
    # dashboard under SSL/TLS, Origin Server. Key file: root:root, mode 0600.
    ssl_certificate         /etc/ssl/cloudflare/dashboard.example.com.pem;
    ssl_certificate_key     /etc/ssl/cloudflare/dashboard.example.com.key;

    # Authenticated Origin Pulls: nginx accepts only TLS clients that present a certificate signed
    # by this CA, which is how the origin knows the request came through Cloudflare. Download the CA:
    # https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    # (Cloudflare dashboard: SSL/TLS, Origin Server, Authenticated Origin Pulls: on).
    # The shared CA proves "some Cloudflare zone". To bind the origin to your own zones, upload your
    # own client certificate to Cloudflare (zone-level or per-hostname AOP) and put its CA here.
    ssl_client_certificate  /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client       on;
    # ---- end PER-HOST --------------------------------------------------------------------------

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:c15t_dashboard_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is set at the Cloudflare edge (SSL/TLS, Edge Certificates, HSTS), not here. The shared
    # headers snippet is plain HTTP-safe, because infra/test uses it over http.
    # Keep one catch-all `listen 443 ssl default_server; ssl_reject_handshake on;` server on this
    # host so that a request to the origin IP without a known name is dropped.

    root /opt/c15t-platform/current/apps/dashboard-web/dist;
    include snippets/c15t-dashboard-locations.conf;
}
