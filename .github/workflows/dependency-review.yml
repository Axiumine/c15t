name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    # Self-hosted runners (docs/ci-runners.md). A pull request from a fork, or one whose head repository
    # cannot be read, runs on a GitHub-hosted VM instead.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compares the dependency graph of the pull request with its base (the yarn.lock changes
      # and the GitHub Actions in .github). It needs the dependency graph, which is on by default
      # for public repositories. The result goes to the job summary; no comment is posted, so the
      # job stays read-only.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a pull request that adds a runtime dependency with a known high or critical
          # vulnerability.
          fail-on-severity: high
          # Licenses compatible with distributing the platform under AGPL-3.0-or-later. Checked
          # against the installed packages on 2026-10-30; that set only contained MIT, Apache-2.0,
          # ISC, BSD-2-Clause, BSD-3-Clause, MPL-2.0 (lightningcss, a build tool), MIT-0,
          # Unlicense, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0 (caniuse-lite data), 0BSD and
          # "MIT OR Apache-2.0" / "MIT AND ISC AND BSD-3-Clause" expressions, plus the project's
          # own AGPL-3.0-or-later. GPL-2.0-only is deliberately absent: it cannot be combined
          # with AGPL-3.0. LGPL-3.0-only is allowed for eslint-plugin-sonarjs (a devDependency of
          # `yarn lint:eslint`, never shipped in a release): LGPL-3.0 is compatible with AGPL-3.0
          # (docs/dependency-policy.md).
          allow-licenses: >-
            MIT, MIT-0, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense,
            BlueOak-1.0.0, Python-2.0, Zlib, MPL-2.0, CC-BY-4.0, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, GPL-3.0-or-later, AGPL-3.0-or-later
          # The repository's own workspace packages are private and carry no registry metadata. The three
          # others are permissive licenses that the dependency graph reports as compound expressions
          # no allow-list entry can match: uri-js "BSD-2-Clause AND BSD-2-Clause-Views" (a dependency of
          # ESLint, dev only), protobuf "BSD-3-Clause AND LicenseRef-scancode-protobuf" (BSD-3-Clause plus
          # Google's patent notice, installed from .github/ci-tools/semgrep for the Security scan job) and
          # pywin32 "PSF-2.0" (listed in that lockfile for Windows only, never installed on the runner).
          allow-dependencies-licenses: >-
            pkg:npm/%40consent/consent-api, pkg:npm/%40consent/dashboard-api,
            pkg:npm/%40consent/dashboard-web, pkg:npm/%40consent/db, pkg:npm/%40consent/shared,
            pkg:npm/%40consent/config, pkg:npm/c15t-platform, pkg:npm/uri-js,
            pkg:pypi/protobuf, pkg:pypi/pywin32
