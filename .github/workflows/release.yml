name: Release

# Push a tag vMAJOR.MINOR.PATCH[-prerelease] on a commit that is on main (and whose version in
# package.json matches). The workflow builds the artifacts, signs every one of them with keyless
# cosign (Sigstore), attaches SLSA provenance, a CycloneDX SBOM per app and SHA256SUMS, and
# publishes one GitHub release. Release notes come from the matching CHANGELOG.md section.
#
# Job chain: build (no secrets, no id-token) -> sign and provenance (id-token only) -> release
# (contents: write only). Nothing that runs third-party build code can write to the repository
# or mint an identity token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  YARN_NODE_LINKER: node-modules
  YARN_ENABLE_TELEMETRY: "0"

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # sha256sum output of the artifacts, base64 encoded: the subjects of the SLSA provenance.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the next step needs origin/main.
          fetch-depth: 0
          persist-credentials: false

      # Only commits that went through main (pull request, CI, review) can be released.
      - name: Check that the tagged commit is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Not on main::The tagged commit $GITHUB_SHA is not reachable from main."
            exit 1
          fi

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: yarn build

      # Validates the tag (semantic version, equal to the version in package.json, points at this
      # commit), then writes the tarballs, the SBOMs and SHA256SUMS into release-out/.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-package.sh "$TAG" release-out

      - name: Hash the artifacts
        id: hash
        working-directory: release-out
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum -- *.tar.gz *.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign release files (cosign, keyless)
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the Sigstore certificate is bound to this workflow's OIDC identity
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-out

      # The files must be exactly what the build job hashed (and what the provenance covers).
      - name: Verify the hashes from the build job
        env:
          HASHES: ${{ needs.build.outputs.hashes }}
        run: |
          set -euo pipefail
          printf '%s' "$HASHES" | base64 -d > subjects.sha256
          cd release-out
          sha256sum --check --strict ../subjects.sha256

      # cosign v3.0.6 is the release this version of the installer verifies against checksums
      # embedded in the action itself.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # One <file>.sigstore.json bundle (signature, certificate and transparency log entry) per
      # artifact, each verified right away against this workflow's identity.
      - name: Sign and verify every artifact
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}"
          cd release-out
          for file in *.tar.gz *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
          done

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: release-out/*.sigstore.json
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: SLSA provenance
    needs: [build]
    permissions:
      actions: read # the generator reads the workflow run to record the build
      id-token: write # the provenance is signed with the workflow's OIDC identity
      contents: write # the generator's upload-assets job requests it, even when it is skipped
    # KNOWN, JUSTIFIED PINNING EXCEPTION: the only `uses:` in this repository that is not pinned
    # to a commit SHA. The SLSA generator has to be referenced by a release tag, because its
    # builder resolves its own ref at run time and the provenance names that ref; the project
    # documents that a commit SHA does not work
    # (https://github.com/slsa-framework/slsa-github-generator#referencing-the-slsa-generators).
    # Dependabot's github-actions ecosystem keeps the tag current.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      # The provenance is attached by the release job, in the same step that publishes the
      # release, so a release never exists without it (and nothing is added to a published one).
      upload-assets: false

  release:
    name: Publish GitHub release
    needs: [build, sign, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-out

      - name: Download the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: release-out

      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance

      - name: Verify the hashes from the build job
        env:
          HASHES: ${{ needs.build.outputs.hashes }}
        run: |
          set -euo pipefail
          printf '%s' "$HASHES" | base64 -d > subjects.sha256
          cd release-out
          sha256sum --check --strict ../subjects.sha256

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Notes: the CHANGELOG.md section of this version (exit status 3: there is none, so
          # GitHub generates them), followed by how to verify the assets.
          generate=()
          if bash scripts/release-notes.sh "$TAG" > notes.md; then
            printf '\n' >> notes.md
          else
            status=$?
            [ "$status" -eq 3 ] || exit "$status"
            : > notes.md
            generate=(--generate-notes)
          fi
          cat >> notes.md <<EOF
          ## Verify the assets

          Every asset has a keyless cosign signature (\`<asset>.sigstore.json\`) and the release has
          SLSA provenance (\`*.intoto.jsonl\`). The SBOMs are CycloneDX 1.6 (\`*.cdx.json\`).

          \`\`\`sh
          sha256sum --check SHA256SUMS
          cosign verify-blob --bundle <asset>.sigstore.json \\
            --certificate-identity https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/tags/${TAG} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
          slsa-verifier verify-artifact <asset> --provenance-path <provenance>.intoto.jsonl \\
            --source-uri github.com/${GH_REPO} --source-tag ${TAG}
          \`\`\`

          The built tarballs hold compiled output; the platform itself is deployed from the tagged
          source with \`infra/deploy.sh\`.
          EOF

          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          gh release create "$TAG" release-out/* provenance/*.intoto.jsonl \
            --verify-tag --title "$TAG" --notes-file notes.md \
            "${generate[@]}" "${prerelease[@]}"
