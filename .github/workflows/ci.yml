name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. Runs on main always finish, so every
# commit that lands has a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # .yarnrc.yml sets the same values; they are repeated here so CI does not depend on that file.
  YARN_NODE_LINKER: node-modules
  YARN_ENABLE_TELEMETRY: "0"

jobs:
  verify:
    name: Verify (typecheck, lint, build)
    # Self-hosted runners (docs/ci-runners.md). A pull request from a fork, or one whose head repository
    # cannot be read, runs on a GitHub-hosted VM instead.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # Every source file has an SPDX header, and every other file is covered by REUSE.toml.
      - name: Check SPDX headers
        run: yarn spdx:check

      - name: Build
        run: yarn build

      # infra/deploy.sh install and uninstall, and the Cloudflare IP updater, against a temporary
      # directory with stand-ins for systemctl, nginx, nft and curl: no Docker, no root, no network.
      # (nginx-snippet.test.sh needs Docker and is run by hand, see CONTRIBUTING.md.)
      - name: Test the infra scripts
        run: |
          bash infra/test/uninstall.test.sh
          bash infra/test/update-cloudflare-ips.test.sh

  # The static analysers of docs/quality-gates.md that Biome and tsc do not cover. Each is a yarn script
  # that a developer runs locally (lefthook runs them before a push), and each passes with zero findings:
  # a failure is a change that made the code worse, not a backlog.
  static-analysis:
    name: Static analysis (ESLint, knip, type coverage, FTA, code caps)
    # Self-hosted runners (docs/ci-runners.md). A pull request from a fork, or one whose head repository
    # cannot be read, runs on a GitHub-hosted VM instead.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      # `tsc -b` writes the declarations of every workspace; the type-aware ESLint rules read them.
      - name: Typecheck
        run: yarn typecheck

      - name: ESLint
        run: yarn lint:eslint

      - name: Knip (unused files, exports and dependencies)
        run: yarn knip

      - name: Type coverage (no any)
        run: yarn type-coverage

      - name: FTA (maintainability score)
        run: yarn fta

      - name: Code caps (size and shape ratchet)
        run: yarn code-caps

      # node:test suites of scripts/, gated at 100% lines, branches and functions of the scripts they cover.
      - name: Test the scripts (coverage gate)
        run: yarn test:scripts-coverage

  # Two clean builds of the same commit, from different directories, in different time zones and with
  # different file times, must give byte-identical dist/ trees and release files. The script clones the
  # commit twice and installs from the lockfile in each clone, so this job needs no install of its own.
  reproducible:
    name: Reproducible build
    # Self-hosted runners (docs/ci-runners.md). A pull request from a fork, or one whose head repository
    # cannot be read, runs on a GitHub-hosted VM instead.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Build twice and compare
        run: bash scripts/verify-reproducible-build.sh

  # The real-database suites fail loudly instead of skipping when their variables are missing
  # (a green run must mean the database was exercised), so there is no database-free run of
  # `yarn test`: every test runs here, against a real PostgreSQL server.
  test:
    name: Test (PostgreSQL 17, coverage)
    # Self-hosted runners (docs/ci-runners.md). A pull request from a fork, or one whose head repository
    # cannot be read, runs on a GitHub-hosted VM instead.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 25
    env:
      # Throwaway administrator password of a container that only this job can reach.
      CI_PG_ADMIN_PASSWORD: ci-only-throwaway-admin-password
      # Several date-range tests assume UTC. GitHub-hosted runners are UTC already; this keeps
      # the result the same when the job is reproduced on a machine with another time zone.
      TZ: UTC
      # postgres:17 (17.11), the multi-arch image index, pinned by digest. Dependabot does not
      # update an image named in an env value, so bump the digest by hand: it is the
      # Docker-Content-Digest header of the registry manifest for the tag.
      PG_IMAGE: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
      # Unique per run, so jobs that share a runner host never meet, and the last step can remove it.
      PG_CONTAINER: c15t-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      # Creates the roles and schemas (infra/postgres/init.sql), applies the c15t and app
      # migrations and exports DATABASE_URL_C15T, DATABASE_URL_DASHBOARD and C15T_ADMIN_API_KEY
      # with every secret masked. psql comes from the runner image.
      # A script, not `services:`: the port is random and above 50000, never 5432, so it cannot meet
      # another job's database or a PostgreSQL that runs on the runner host. The script sets PGPORT.
      - name: Start PostgreSQL
        env:
          POSTGRES_PASSWORD: ${{ env.CI_PG_ADMIN_PASSWORD }}
        run: bash scripts/ci-start-postgres.sh

      - name: Bootstrap the database
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_PG_ADMIN_PASSWORD }}
        run: bash scripts/ci-bootstrap-db.sh

      # @vitest/coverage-v8 is a pinned devDependency, so the report is always produced. If the
      # package ever goes missing, vitest fails here instead of silently running without coverage.
      - name: Test
        run: >-
          yarn test
          --coverage.enabled
          --coverage.provider=v8
          --coverage.reportsDirectory=coverage
          --coverage.reportOnFailure=true
          --coverage.reporter=text-summary
          --coverage.reporter=lcov
          --coverage.reporter=json-summary

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: docker rm --force "${PG_CONTAINER}" > /dev/null 2>&1 || true
