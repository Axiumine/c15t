name: Scorecard supply-chain security

# Constraints from https://github.com/ossf/scorecard-action#workflow-restrictions, which apply
# because publish_results is true. Keep this file free of: workflow-level env or defaults,
# job-level env or defaults in the analysis job, containers and services, run steps, and any
# action outside the approved list (actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif, ossf/scorecard-action, step-security/harden-runner).
# Only the analysis job may hold id-token: write.
on:
  # Re-run when the branch protection rules change, because the Branch-Protection check reads them.
  branch_protection_rule:
  schedule:
    # Tuesdays 04:17 UTC (the scorecard-action only runs scheduled workflows on the default branch).
    - cron: "17 4 * * 2"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish_results: OIDC token to authenticate with the Scorecard API
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Branch-Protection check needs a token that can read the repository's protection
          # rules; GITHUB_TOKEN cannot. Create SCORECARD_TOKEN as a fine-grained personal access
          # token with read-only "Administration" and "Metadata" on this repository (see
          # https://github.com/ossf/scorecard-action#authentication-with-fine-grained-pat-optional)
          # and store it as a repository secret. Without it the run falls back to GITHUB_TOKEN and
          # Branch-Protection is reported with reduced information.
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: true

      # Kept for debugging: the SARIF file is also visible on the Actions tab for five days.
      - name: Upload the SARIF file as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
