name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Is it a security problem? Do not post it here, use the private
        [security advisory form](https://github.com/Axiumine/c15t/security/advisories/new) instead.
        Remove passwords, API keys, database URLs and personal data from everything you paste.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - consent-api
        - dashboard-api
        - dashboard-web
        - packages (db, shared, config)
        - infra (nginx, systemd, PostgreSQL bootstrap, deploy.sh)
        - documentation
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps (or a failing test) that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, Yarn version, operating system, PostgreSQL version, how you run the services (systemd, dev server), nginx and Cloudflare in front or not.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: Relevant log lines, with secrets removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
