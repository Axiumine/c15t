nodeLinker: node-modules

enableTelemetry: false

# yarn <script> loads the root env file in development. In production systemd loads
# EnvironmentFile= and starts /usr/bin/node directly, so no env file exists on the server.
injectEnvironmentFiles:
  - ".env?"
