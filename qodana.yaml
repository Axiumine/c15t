# JetBrains Qodana configuration (docs/quality-gates.md, docs/security-scanning.md "Qodana").
# Read by .github/workflows/qodana.yml (JetBrains/qodana-action) and by `yarn qodana` (scripts/qodana.sh).
#
# Qodana runs the JetBrains IDE inspections (WebStorm) without an IDE. It is an extra layer next to
# Biome, ESLint, knip, Semgrep, Trivy and CodeQL, not a replacement for any of them. It needs a paid
# license: the QODANA_TOKEN environment variable carries a Qodana Cloud project token, which is also how
# the report reaches Qodana Cloud. Never put a token in this file. The whole file is included in the
# report that is sent to Qodana Cloud, so nothing in it may be sensitive.
#
# STATE: nobody has run this configuration with a token yet. Its first real result is unknown, and so is
# whether every key below behaves as written (see "Before you trust it" in docs/security-scanning.md).
version: "1.0"

# The linter is the Docker image jetbrains/qodana-js (Ultimate and Ultimate Plus licenses). The tags of that
# image are only major.minor (2026.2) and move when JetBrains ships a fix, so the image is pinned by the
# digest of the multi-architecture manifest, with the tag kept for readers. `image:` wins over `linter:` in
# the Qodana CLI; `linter:` stays as the fallback for a CLI that does not know `image:`.
# To update, follow "Update the pins" in docs/security-scanning.md.
linter: qodana-js
image: jetbrains/qodana-js:2026.2@sha256:aadf928b1e8e846069f74edbf00aca614336708402b795f8c539fa06e766a096

# qodana.recommended is the profile JetBrains documents for CI/CD; the default (qodana.starter) is a subset
# of it. A stricter profile is not justified before the first result is known. The ESLint inspection is not
# switched on (`include: Eslint`): `yarn lint:eslint` already gates the same rules at zero findings.
profile:
  name: qodana.recommended

# Nothing below is code that people write or review. Build output, dependencies and reports are git-ignored
# too, and the recommended profile skips git-ignored paths; they are listed anyway so that this file does not
# depend on that. All paths are relative to the repository root.
exclude:
  - name: All
    paths:
      # Dependencies, build output, caches and reports.
      - node_modules/**
      - "**/node_modules/**"
      - .yarn/**
      - "**/dist/**"
      - "**/.tsbuild/**"
      - "**/coverage/**"
      - playwright-report/**
      - test-results/**
      - blob-report/**
      - .qodana/**
      # Lock files.
      - yarn.lock
      - .github/ci-tools/package-lock.json
      # Generated by tools and never edited by hand (also excluded in biome.json and eslint.config.mjs).
      - packages/db/drizzle/**
      - packages/db/src/c15t.generated.ts
      - apps/dashboard-web/src/routeTree.gen.ts
      # A stand-in single-page app that the nginx test container serves; not our code.
      - infra/test/nginx/placeholder/**

# The JetBrains image ships Node.js 22 and Yarn 1.22; this repository needs Yarn 4 (the `packageManager` field
# of package.json), which Corepack fetches. Without node_modules and without the declarations that `tsc -b`
# writes for the workspaces, every import would be "unresolved" and the result would be mostly noise.
# - Dependency lifecycle scripts stay off (YARN_ENABLE_SCRIPTS=false): the linter container holds the
#   QODANA_TOKEN, and installing dependencies must not run their code next to it. The scripts only build
#   binaries, which an analysis does not need. C15T_SKIP_HOOKS=1 keeps our own postinstall from installing Git
#   hooks into the checkout.
# - `--immutable` fails the run when yarn.lock does not match, exactly as in CI.
# - A failing typecheck is reported but does not stop the scan: Qodana then still finds something, and
#   `yarn typecheck` in CI is the gate for type errors.
bootstrap: |
  set -eu
  export COREPACK_ENABLE_DOWNLOAD_PROMPT=0 YARN_ENABLE_TELEMETRY=0 YARN_ENABLE_SCRIPTS=false C15T_SKIP_HOOKS=1
  corepack yarn install --immutable
  corepack yarn typecheck || echo "qodana bootstrap: yarn typecheck failed; types of the workspaces may be unresolved" >&2

# Quality gate: the run ends with exit code 255 (the action marks the job failed) when the number of problems
# is above `any`. The first result could not be measured when this was written, so 500 is a ceiling, not a
# target: high enough that a first run is unlikely to fail on volume alone, low enough to catch a broken
# bootstrap (then every import is unresolved and the count is in the thousands). After the first real run:
# read the report, fix or suppress what is wrong, and set `any` to the count you accept (a number you can lower
# later, one fix at a time). A per-severity gate (`critical`, `high`, ...) can sit next to it.
# Pull requests are analysed on the changed files only (pr-mode in the workflow), so a ceiling like this is
# aimed at the runs that scan the whole tree: pushes to main, the weekly run and manual runs.
failureConditions:
  severityThresholds:
    any: 500
